version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Australia/Melbourne
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Australia/Melbourne
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /.github/actions/actionlint
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Australia/Melbourne
    cooldown:
      default-days: 7
