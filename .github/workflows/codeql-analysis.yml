name: Reusable CodeQL
on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of CodeQL languages supported with build-mode none
        type: string
        default: '["actions"]'
      enabled:
        description: Explicit scan activation; private callers must already have Code Security
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  availability:
    name: CodeQL availability
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report scan activation
        env:
          ENABLED: ${{ inputs.enabled }}
        run: |
          if [ "$ENABLED" = true ]; then
            echo "CodeQL was requested; analysis results determine success." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CodeQL is disabled. No scan ran." >> "$GITHUB_STEP_SUMMARY"
          fi
  analyze:
    name: Analyze (${{ matrix.language }})
    if: inputs.enabled
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read  # Read workflow-run metadata for the caller.
      security-events: write  # Upload CodeQL results for the caller.
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - name: Check out caller
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze source
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
