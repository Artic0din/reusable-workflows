name: Reusable guarded Dependabot auto-merge
on:
  workflow_call:
    inputs:
      enabled:
        description: Explicit caller opt-in after strict repository rules are configured
        type: boolean
        default: false
      required-checks:
        description: Nonempty JSON array of exact required check contexts
        type: string
        required: true
permissions: {}
jobs:
  dependency:
    name: Queue verified Dependabot update
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write  # Request a protected squash merge for the verified head.
      pull-requests: write  # Enable auto-merge without approving reviews.
    steps:
      - name: Verify current merge eligibility
        if: ${{ inputs.enabled }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_CHECKS: ${{ inputs.required-checks }}
        run: |
          jq -en --argjson checks "$REQUIRED_CHECKS" '
            ($checks | type == "array" and length > 0) and
            all($checks[]; type == "string" and test("\\S"))
          '
          gh api "repos/$REPOSITORY" > "$RUNNER_TEMP/repository.json"
          jq -e --arg base "$BASE_BRANCH" '
            .allow_auto_merge == true and .allow_squash_merge == true and .default_branch == $base
          ' "$RUNNER_TEMP/repository.json"
          encoded_branch=$(jq -rn --arg branch "$BASE_BRANCH" '$branch | @uri')
          gh api "repos/$REPOSITORY/rules/branches/$encoded_branch" |
            jq -e --argjson expected "$REQUIRED_CHECKS" '
              [.[] | select(.type == "required_status_checks" and
                .parameters.strict_required_status_checks_policy == true)] as $rules |
              any(.[]; .type == "pull_request" and .parameters.required_review_thread_resolution == true) and
              (($expected - [$rules[].parameters.required_status_checks[].context]) | length == 0)
            '
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/dependency-pr.json"
          jq -e --arg head "$PR_HEAD_SHA" --arg repo "$REPOSITORY" --arg base "$BASE_BRANCH" '
            .state == "open" and .draft == false and .user.login == "dependabot[bot]" and
            .head.sha == $head and .head.repo.full_name == $repo and
            .base.ref == $base and .base.repo.full_name == $repo
          ' "$RUNNER_TEMP/dependency-pr.json"
          gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" |
            jq -e --arg head "$PR_HEAD_SHA" --slurpfile pr "$RUNNER_TEMP/dependency-pr.json" '
              add as $commits |
              $pr[0].commits == ($commits | length) and
              ($commits | length) > 0 and $commits[-1].sha == $head and
              all($commits[]; .author.login == "dependabot[bot]" and
                .committer.login == "web-flow" and .commit.verification.verified == true)
            '
      - name: Verify Dependabot metadata
        id: metadata
        if: ${{ inputs.enabled }}
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Queue eligible update
        id: enable-automerge
        if: ${{ success() && steps.metadata.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
        run: |
          case "$(printf '%s' "$DEPENDENCY_NAMES" | tr '[:upper:]' '[:lower:]')" in
            ''|*artic0din/reusable-workflows*) exit 0 ;;
          esac
          if [[ "$MAINTAINER_CHANGES" != "false" ]]; then
            exit 0
          fi
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *) exit 0 ;;
          esac
          gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
      - name: Cancel automatic merges requiring manual review
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          JOB_STATUS: ${{ job.status }}
          QUEUE_OUTCOME: ${{ steps.enable-automerge.outcome }}
          QUEUE_ELIGIBLE: ${{ steps.enable-automerge.outputs.eligible }}
        run: |
          # Only the complete successful eligibility decision may retain a queue.
          if [[ "$JOB_STATUS" == "success" && "$METADATA_OUTCOME" == "success" &&
                "$QUEUE_OUTCOME" == "success" && "$QUEUE_ELIGIBLE" == "true" ]]; then
            exit 0
          fi
          echo "Update did not pass automatic merge eligibility; manual review is required."
          if ! auto_merge="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')"; then
            echo "Cannot read existing auto-merge state." >&2
            exit 1
          fi
          case "$auto_merge" in
            true) gh pr merge --disable-auto "$PR_URL" ;;
            false) ;;
            *) echo "Cannot determine existing auto-merge state." >&2; exit 1 ;;
          esac
