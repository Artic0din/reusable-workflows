name: Reusable repository baseline
on:
  workflow_call:
    inputs:
      required-files:
        description: Comma-separated repository-relative files required by this project
        type: string
        default: README.md, LICENSE, .gitignore, AGENTS.md
permissions:
  contents: read
jobs:
  baseline:
    name: Repository baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate required files
        env:
          REQUIRED_FILES: ${{ inputs.required-files }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          paths = [entry.strip() for entry in os.environ["REQUIRED_FILES"].split(",") if entry.strip()]
          if not paths:
              raise SystemExit("required-files must include at least one path")
          missing = [path for path in paths if not Path(path).exists()]
          if missing:
              raise SystemExit(f"Required paths do not exist: {missing!r}")
          print(f"Validated {len(paths)} required paths")
          PY
