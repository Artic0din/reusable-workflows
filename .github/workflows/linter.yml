name: Reusable workflow validation
on:
  workflow_call:
    inputs:
      yaml-paths:
        description: Newline-separated YAML files or directories in the caller repository
        type: string
        default: .github
      yaml-config:
        description: Caller-owned yamllint configuration
        type: string
        default: .yamllint.yml
      validate-agent-config:
        description: Check agent metadata, local links, and instruction scopes
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  lint:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Check out versioned validation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Artic0din/reusable-workflows
          # Library-owned executable tools cannot be replaced by a caller input.
          ref: 2cb8bcb477a910e6b6a388762e18e1dda823a4f1
          path: automation
          persist-credentials: false
      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: automation/.python-version
      - name: Install locked validation tools
        run: python -m pip install --require-hashes -r automation/requirements-dev.txt
      - name: Validate caller YAML
        working-directory: source
        env:
          YAML_PATHS: ${{ inputs.yaml-paths }}
          YAML_CONFIG: ${{ inputs.yaml-config }}
        run: |
          paths=()
          while IFS= read -r path; do
            if [[ "$path" =~ [^[:space:]] ]]; then
              paths+=("$path")
            fi
          done <<< "$YAML_PATHS"
          test "${#paths[@]}" -gt 0
          yamllint --strict -c "$YAML_CONFIG" -- "${paths[@]}"
      - name: Check workflow security
        working-directory: source
        run: zizmor --offline --pedantic .github
      - name: Check workflow syntax
        run: |
          docker build --tag reusable-actionlint automation/.github/actions/actionlint
          docker run --rm --mount "type=bind,source=$GITHUB_WORKSPACE/source,target=/src,readonly" \
            --workdir /src reusable-actionlint -color
      - name: Validate agent configuration
        if: inputs.validate-agent-config
        run: python automation/scripts/validate_agent_config.py source
